name: Axioma Zero-Trust Governance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-invariants:
    name: Verify Invariants & Self-Healing Loops
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: axioma
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/axioma
        run: npx drizzle-kit migrate

      - name: Run Invariant Unit & Integration Tests (58 tests)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/axioma
        run: npm test

      - name: Execute Self-Healing Verification Sandbox
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/axioma
        run: npm run test:sandbox

      - name: Verify Cross-Domain Handoff Lifecycle
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/axioma
        run: npx tsx scripts/cross-domain-handoff.ts

      - name: Next.js Production Build
        run: npm run build
